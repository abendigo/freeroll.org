name: PR Preview (App)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "svelte.config.js"
      - "vite.config.ts"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/pr-preview-app.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Turso CLI
        run: curl -sSfL https://get.tur.so/install.sh | bash

      - name: Branch database from staging template
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: |
          DB_NAME="freeroll-app-pr-${{ github.event.number }}"
          # Fresh branch on every push to this PR, not reused — delete any leftover from a
          # prior push first (no-op if this is the first push, hence the || true).
          $HOME/.turso/turso db destroy "$DB_NAME" --yes || true
          $HOME/.turso/turso db create "$DB_NAME" --from-db freeroll-staging

      - run: npm ci
      - run: npm run build

      - name: Deploy preview worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name freeroll-app-pr-${{ github.event.number }}

      - name: Set worker secrets on preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: |
          DB_NAME="freeroll-app-pr-${{ github.event.number }}"
          WORKER_NAME="freeroll-app-pr-${{ github.event.number }}"
          DB_URL=$($HOME/.turso/turso db show "$DB_NAME" --url)
          DB_TOKEN=$($HOME/.turso/turso db tokens create "$DB_NAME")
          echo -n "$DB_URL" | npx wrangler secret put TURSO_DATABASE_URL --name "$WORKER_NAME"
          echo -n "$DB_TOKEN" | npx wrangler secret put TURSO_AUTH_TOKEN --name "$WORKER_NAME"
          echo -n "${{ secrets.HASH_SECRET }}" | npx wrangler secret put HASH_SECRET --name "$WORKER_NAME"
          echo -n "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY --name "$WORKER_NAME"
          echo -n "${{ secrets.FROM_ADDRESS }}" | npx wrangler secret put FROM_ADDRESS --name "$WORKER_NAME"
          # So magic-link emails sent from this preview point back at itself, not production.
          echo -n "${{ steps.deploy.outputs.deployment-url }}" | npx wrangler secret put APP_BASE_URL --name "$WORKER_NAME"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.deployment-url }}";
            const marker = "<!-- freeroll-app-preview-comment -->";
            const body = `${marker}\n🚀 App preview deployed: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
