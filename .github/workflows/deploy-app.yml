name: Deploy App to Production

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "svelte.config.js"
      - "vite.config.ts"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-app.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Set worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo -n "${{ secrets.TURSO_DATABASE_URL }}" | npx wrangler secret put TURSO_DATABASE_URL --name freeroll-app
          echo -n "${{ secrets.TURSO_AUTH_TOKEN }}" | npx wrangler secret put TURSO_AUTH_TOKEN --name freeroll-app
          echo -n "${{ secrets.HASH_SECRET }}" | npx wrangler secret put HASH_SECRET --name freeroll-app
          echo -n "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY --name freeroll-app
          echo -n "${{ secrets.FROM_ADDRESS }}" | npx wrangler secret put FROM_ADDRESS --name freeroll-app
          # Coming-soon gate — see src/hooks.server.ts. COMING_SOON is usually unset (repo/org
          # secrets that don't exist just resolve to an empty string here, which is off); flip
          # it to "true" in the repo's Actions secrets to hide the site, "false"/delete to
          # unhide. PREVIEW_SECRET is the bypass value for /?preview=<secret>.
          echo -n "${{ secrets.COMING_SOON }}" | npx wrangler secret put COMING_SOON --name freeroll-app
          echo -n "${{ secrets.PREVIEW_SECRET }}" | npx wrangler secret put PREVIEW_SECRET --name freeroll-app
          # Bot traffic simulation — see src/lib/server/bots/ and workers/bot-tick/. Same
          # usually-unset-is-off shape as COMING_SOON above: BOT_TRAFFIC_ENABLED must be
          # explicitly "true" for the tick endpoint to do anything at all. BOT_TICK_SECRET is
          # the bearer credential the bot-tick Worker presents (also set on that Worker, via
          # deploy-bot-tick-worker.yml).
          echo -n "${{ secrets.BOT_TRAFFIC_ENABLED }}" | npx wrangler secret put BOT_TRAFFIC_ENABLED --name freeroll-app
          echo -n "${{ secrets.BOT_TICK_SECRET }}" | npx wrangler secret put BOT_TICK_SECRET --name freeroll-app
          # Production only — PR previews deliberately don't get these, so test traffic never
          # pollutes real analytics.
          echo -n "${{ secrets.PUBLIC_UMAMI_URL }}" | npx wrangler secret put PUBLIC_UMAMI_URL --name freeroll-app
          echo -n "${{ secrets.PUBLIC_UMAMI_WEBSITE_ID }}" | npx wrangler secret put PUBLIC_UMAMI_WEBSITE_ID --name freeroll-app
