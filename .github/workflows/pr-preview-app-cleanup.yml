name: PR Preview Cleanup (App)

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete preview worker for this PR
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # || true: harmless no-op if the preview workflow never ran for this PR (e.g. it never
        # touched an app path) and no worker was ever created for it to delete.
        run: npx wrangler delete "freeroll-app-pr-${{ github.event.number }}" --force || true

      - name: Install Turso CLI
        run: curl -sSfL https://get.tur.so/install.sh | bash

      - name: Delete preview database branch for this PR
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        # || true: harmless no-op if the preview workflow never ran for this PR (e.g. closed
        # without a path-matching push) and no branch was ever created.
        run: $HOME/.turso/turso db destroy "freeroll-app-pr-${{ github.event.number }}" --yes || true
